<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hex Tool Mobile</title>

<style>
html,body{
margin:0;
overflow:hidden;
background:#222;
overscroll-behavior: none;
-webkit-tap-highlight-color: transparent;
font-family: Arial, sans-serif;
}

canvas{
display:block;
width:100%;
height:100%;
}

/* Hamburger Menu Icon */
#menuToggle {
    display: block;
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 100;
    -webkit-user-select: none;
    user-select: none;
}

#menuToggle input {
    display: block;
    width: 40px;
    height: 32px;
    position: absolute;
    top: -7px;
    left: -5px;
    cursor: pointer;
    opacity: 0; /* hide this */
    z-index: 2; /* and place it over the hamburger */
    -webkit-touch-callout: none;
}

#menuToggle span {
    display: block;
    width: 33px;
    height: 4px;
    margin-bottom: 5px;
    position: relative;
    background: #cdcdcd;
    border-radius: 3px;
    z-index: 1;
    transform-origin: 4px 0px;
    transition: transform 0.5s cubic-bezier(0.77,0.2,0.05,1.0),
                background 0.5s cubic-bezier(0.77,0.2,0.05,1.0),
                opacity 0.55s ease;
}

#menuToggle span:first-child {
    transform-origin: 0% 0%;
}

#menuToggle span:nth-last-child(2) {
    transform-origin: 0% 100%;
}

/* Transform all the slices of hamburger into a cross */
#menuToggle input:checked ~ span {
    opacity: 1;
    transform: rotate(45deg) translate(0px, -1px);
    background: #232323;
}
/* Hide the middle line */
#menuToggle input:checked ~ span:nth-last-child(3) {
    opacity: 0;
    transform: rotate(0deg) scale(0.2, 0.2);
}
/* Rotate last one the other way */
#menuToggle input:checked ~ span:nth-last-child(2) {
    transform: rotate(-45deg) translate(-2px, 0px);
}

/* And slide it out from the left */
#menu {
    position: absolute;
    width: 200px;
    height: 100vh;
    margin: -100px 0 0 -50px;
    padding: 125px 50px 50px 50px;
    padding-top: 125px;
    background: #ededed;
    list-style-type: none;
    -webkit-font-smoothing: antialiased;
    transform-origin: 0% 0%;
    transform: translate(-100%, 0);
    transition: transform 0.5s cubic-bezier(0.77,0.2,0.05,1.0);
    z-index: 90;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 2px 0 5px rgba(0,0,0,0.2);
}

#menuToggle input:checked ~ ul {
    transform: none;
}

#menu button {
    display: block;
    width: 100%;
    padding: 12px 10px;
    border: none;
    border-radius: 5px;
    background: #333;
    color: white;
    font-weight: bold;
    font-size: 1.1em;
    cursor: pointer;
    text-align: left;
    transition: background 0.2s ease;
}

#menu button:hover {
    background: #555;
}

#ui {
    display: none; /* Nascondiamo la vecchia UI */
}

/* Stili per l'esagono master separato */
#masterOverlay {
    position: absolute;
    /* Adjusted bottom to be relative to the masterHex position in JS */
    /* This div will be positioned programmatically by JS relative to masterHex.x, masterHex.y */
    left: 50%;
    transform: translateX(-50%);
    z-index: 50; /* Sopra la griglia ma sotto il menu */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}

#masterLabel {
    color: white;
    font-size: 1.2em;
    font-weight: bold;
    text-shadow: 0 0 5px black;
    opacity: 0.7;
}

#toggleMasterBtn {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9em;
}

</style>
</head>
<body>

<div id="menuToggle">
    <input type="checkbox" />
    <span></span>
    <span></span>
    <span></span>
    <ul id="menu">
        <button id="clearBtn">Clear Drawing</button>
        <button id="loadBtn">Load Image</button>
        <button id="saveBtn">Save Master Image</button>
        <button id="resetBtn">Reset Rotations</button>
        <button id="loadRotBtn">Load Rotations</button>
        <button id="saveRotBtn">Save Rotations</button>
        <button id="savePavementBtn">Save Pavement</button>
        <button id="borderBtn">Border ON</button>
        <input type="file" id="fileInput" accept="image/*">
        <input type="file" id="rotInput" accept="application/json">
    </ul>
</div>

<canvas id="c"></canvas>

<div id="masterOverlay">
    <div id="masterLabel">Master Hexagon</div>
    <button id="toggleMasterBtn">Master ON</button>
</div>


<script>
let loadedRotations = null;
let loadStepIndex = 0;
const GRID_W = 10;
const GRID_H = 10;

const c=document.getElementById("c");
const ctx=c.getContext("2d");

let W,H;
let S; // Dimensione esagoni della griglia
let MASTER_S; // Dimensione esagono master separato

const hexes=[];
let masterHex = { x: 0, y: 0, rot: 0, target: 0 }; // L'esagono master ora è un oggetto separato

let strokes=[];
let cur=null;
let drawing=false;
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

let showBorder=true;
let texture=null;
let highlightedMaster=true; // Il master è sempre evidenziato se attivo per disegnare

const masterOverlay = document.getElementById("masterOverlay"); // Riferimento all'overlay HTML

/* ---------- HEX ---------- */
function hexPts(x,y,s,r=0){
const p=[];
for(let i=0;i<6;i++){
const a=r+i*Math.PI/3;
p.push({
x:x+Math.cos(a)*s,
y:y+Math.sin(a)*s
});
}
return p;
}

/* ---------- GRID ---------- */
function build(){
hexes.length = 0;
const h = Math.sqrt(3) * S;
const dx = 1.5 * S;
const dy = h;

const totalGridWidth = (GRID_W - 1) * dx + S * 2;
const totalGridHeight = (GRID_H - 1) * dy + h;

// Calcola l'altezza dell'overlay master per spostare la griglia di conseguenza
// Assumiamo un'altezza fissa o stimala in base al contenuto (label + button)
const masterOverlayHeight = masterLabel.offsetHeight + toggleMasterBtn.offsetHeight + 15; // stima (label + button + gap)

// Sposta la griglia più in alto per fare spazio all'esagono master e al suo overlay
const offsetX = (W / 2) - (totalGridWidth / 2);
const offsetY = (H / 2) - (totalGridHeight / 2) - (MASTER_S + masterOverlayHeight / 2); // Aggiunto masterOverlayHeight

for(let cx = 0; cx < GRID_W; cx++){
for(let cy = 0; cy < GRID_H; cy++){
const x = offsetX + cx * dx;
const y = offsetY + cy * dy + (cx % 2 ? dy / 2 : 0);

hexes.push({
x,
y,
rot: 0,
target: 0
});
}
}

// Posiziona l'esagono master in basso al centro
// Sposta il master un po' più in alto per fare spazio all'overlay
masterHex.x = W / 2;
masterHex.y = H - MASTER_S - (masterOverlayHeight) - 10; // Spostato più in alto rispetto all'overlay e al bordo

// Aggiorna la posizione dell'overlay master basandosi sulla posizione del masterHex
masterOverlay.style.top = (masterHex.y + MASTER_S / 2 - masterOverlayHeight - 100) + 'px'; // Posiziona sopra il master
}

/* ---------- RESIZE ---------- */
function resize(){
W=c.width=innerWidth;
H=c.height=innerHeight;

MASTER_S = Math.min(W, H) * 0.15;
MASTER_S = Math.max(MASTER_S, 50);

const masterOverlayHeight = masterLabel.offsetHeight + toggleMasterBtn.offsetHeight + 15; // stima

const availableGridWidth = W * 0.9;
const availableGridHeight = H * 0.9 - (MASTER_S * 2 + masterOverlayHeight + 30); // Considera l'altezza dell'overlay

S = Math.min(
availableGridWidth / (1.5 * GRID_W + 0.5),
availableGridHeight / (Math.sqrt(3) * GRID_H)
) * 0.9;
S = Math.max(S, 15);

build();
}

/* ---------- POLY ---------- */
function poly(p,fill,stroke,w=2){
ctx.beginPath();
ctx.moveTo(p[0].x,p[0].y);
for(let i=1;i<6;i++){
ctx.lineTo(p[i].x,p[i].y);
}
ctx.closePath();
ctx.fillStyle=fill;
ctx.fill();
if(showBorder){
ctx.strokeStyle=stroke;
ctx.lineWidth=w;
ctx.stroke();
}
}

/* ---------- MARKERS ---------- */
function drawMarkers(hexSize){
const p=hexPts(0,0,hexSize);
ctx.fillStyle="white";
for(let i=0;i<6;i++){
const a=p[i];
const b=p[(i+1)%6];
ctx.beginPath();
ctx.arc(
(a.x+b.x)/2,
(a.y+b.y)/2,
4.5 * (hexSize / 45),
0,
Math.PI*2
);
ctx.fill();
}
}

/* ---------- PATTERN ---------- */
function drawPattern(scale,rot=0){
ctx.save();
ctx.rotate(rot);
ctx.strokeStyle="white";
ctx.lineWidth=6 * (scale / 45);
ctx.lineCap="round";
ctx.lineJoin="round";
for(const s of strokes){
if(s.length<2) continue;
ctx.beginPath();
for(let i=0;i<s.length;i++){
const x=s[i].x*scale;
const y=s[i].y*scale;
if(i===0) ctx.moveTo(x,y);
else ctx.lineTo(x,y);
}
ctx.stroke();
}
ctx.restore();
}

/* ---------- TEXTURE ---------- */
function drawTexture(h, hexSize){
if(!texture) return;
const p=hexPts(0,0,hexSize,0);
ctx.save();
ctx.beginPath();
ctx.moveTo(p[0].x,p[0].y);
for(let i=1;i<6;i++){
ctx.lineTo(p[i].x,p[i].y);
}
ctx.closePath();
ctx.clip();
ctx.rotate(h.rot);
ctx.drawImage(
texture,
-hexSize,
-hexSize,
hexSize*2,
hexSize*2
);
ctx.restore();
}

/* ---------- DRAW HEX ---------- */
function drawHex(h, hexSize = S){
const p=hexPts(h.x,h.y,hexSize,h.rot);
poly(p,"#d60000","black",3 * (hexSize / 45));
ctx.save();
ctx.translate(h.x,h.y);
drawTexture(h, hexSize);
drawPattern(hexSize,h.rot);
drawMarkers(hexSize);
ctx.restore();
}

/* ---------- DRAW MASTER HEX ---------- */
function drawMasterHex(){
const h = masterHex;
const hexSize = MASTER_S;

const p=hexPts(h.x,h.y,hexSize,h.rot);
poly(p,"#d60000","black",3 * (hexSize / 45));

ctx.save();
ctx.translate(h.x,h.y);

drawTexture(h, hexSize);
drawPattern(hexSize, 0);
drawMarkers(hexSize);

if(highlightedMaster){
    ctx.save();
    const pp=hexPts(0,0,hexSize,0);
    ctx.shadowColor="#00aaff";
    ctx.shadowBlur=20 * (hexSize / 45);
    ctx.fillStyle="rgba(0,140,255,0.25)";
    ctx.strokeStyle="#00aaff";
    ctx.lineWidth=4 * (hexSize / 45);
    ctx.beginPath();
    ctx.moveTo(pp[0].x,pp[0].y);
    for(let k=1;k<6;k++){
        ctx.lineTo(pp[k].x,pp[k].y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}
ctx.restore();
}


/* ---------- HIT ---------- */
function inside(x,y,h, hexSize){
const p=hexPts(h.x,h.y,hexSize,h.rot);
let ok=false;
for(let i=0,j=5;i<6;j=i++){
if(
((p[i].y>y)!=(p[j].y>y)) &&
x<(p[j].x-p[i].x)*(y-p[i].y)/(p[j].y-p[i].y)+p[i].x
){
ok=!ok;
}
}
return ok;
}

c.oncontextmenu=e=>e.preventDefault();

/* ---------- INPUT TOUCH ---------- */
let currentTouchHex = null;
let isTouchingMaster = false;

c.addEventListener("touchstart", e => {
    e.preventDefault();
    if (document.getElementById('menuToggle').querySelector('input').checked) {
        return;
    }

    const r = c.getBoundingClientRect();
    const x = e.touches[0].clientX - r.left;
    const y = e.touches[0].clientY - r.top;

    touchStartX = x;
    touchStartY = y;
    touchStartTime = Date.now();

    if (highlightedMaster && inside(x, y, masterHex, MASTER_S)) {
        drawing = true;
        cur = [];
        strokes.push(cur);
        cur.push({
            x: (x - masterHex.x) / MASTER_S,
            y: (y - masterHex.y) / MASTER_S
        });
        isTouchingMaster = true;
        return;
    }

    for (let i = 0; i < hexes.length; i++) {
        if (inside(x, y, hexes[i], S)) {
            currentTouchHex = i;
            isTouchingMaster = false;
            break;
        }
    }
}, { passive: false });

c.addEventListener("touchmove", e => {
    e.preventDefault();
    if (!drawing && currentTouchHex === null && !isTouchingMaster) return;

    const r = c.getBoundingClientRect();
    const x = e.touches[0].clientX - r.left;
    const y = e.touches[0].clientY - r.top;

    if (drawing && cur && isTouchingMaster) {
        cur.push({
            x: (x - masterHex.x) / MASTER_S,
            y: (y - masterHex.y) / MASTER_S
        });
    }
}, { passive: false });


c.addEventListener("touchend", e => {
    e.preventDefault();
    const r = c.getBoundingClientRect();
    const x = e.changedTouches[0].clientX - r.left;
    const y = e.changedTouches[0].clientY - r.top;
    const touchDuration = Date.now() - touchStartTime;

    drawing = false;
    cur = null;

    if (currentTouchHex !== null) {
        const hex = hexes[currentTouchHex];

        if (touchDuration < 200) {
            console.log("ruoto a sinistra (tap)", currentTouchHex);
            hex.target -= Math.PI / 3;
        } else {
            console.log("ruoto a destra (long press)", currentTouchHex);
            hex.target += Math.PI / 3;
        }
    }
    currentTouchHex = null;
    isTouchingMaster = false;
});

// Aggiungiamo anche il supporto mouse per i test su desktop
c.onmousedown=e=>{
    const r=c.getBoundingClientRect();
    const x=e.clientX-r.left;
    const y=e.clientY-r.top;

    if (highlightedMaster && inside(x, y, masterHex, MASTER_S)) {
        drawing = true;
        cur = [];
        strokes.push(cur);
        cur.push({
            x: (x - masterHex.x) / MASTER_S,
            y: (y - masterHex.y) / MASTER_S
        });
        isTouchingMaster = true;
        return;
    }

    for(let i=0;i<hexes.length;i++){
        if(inside(x,y,hexes[i], S)){
            if(e.button===0){
                console.log("ruoto a sinistra", i);
                hexes[i].target-=Math.PI/3;
            }
            if(e.button===2){
                console.log("ruoto a destra", i);
                hexes[i].target+=Math.PI/3;
            }
            break;
        }
    }
};

c.onmousemove=e=>{
    if(!drawing || !cur) return;
    const r=c.getBoundingClientRect();
    const x=e.clientX-r.left;
    const y=e.clientY-r.top;

    if (isTouchingMaster) {
        cur.push({
            x: (x - masterHex.x) / MASTER_S,
            y: (y - masterHex.y) / MASTER_S
        });
    }
};

addEventListener("mouseup",()=>{
    drawing=false;
    cur=null;
    isTouchingMaster = false;
});


/* ---------- UI BUTTONS ---------- */
borderBtn.onclick=()=>{
showBorder=!showBorder;
borderBtn.textContent = showBorder ? "Border ON" : "Border OFF";
};

toggleMasterBtn.onclick=()=>{
highlightedMaster=!highlightedMaster;
toggleMasterBtn.textContent = highlightedMaster ? "Master ON" : "Master OFF";
};

clearBtn.onclick = () => {
if(confirm("Clear all drawing, image and rotations?")){
clearAll();
}
};

function clearAll() {
    strokes = [];
    cur = null;
    drawing = false;
    texture = null;
    if (fileInput) {
        fileInput.value = "";
    }
    if (ctx && W && H) {
        ctx.clearRect(0, 0, W, H);
    }
    for(const h of hexes){
        h.rot=0;
        h.target=0;
    }
}

resetBtn.onclick=()=>{
if(confirm("Reset all rotations?")){
for(const h of hexes){
h.rot=0;
h.target=0;
}
}
};

saveRotBtn.onclick = () => {
const data = hexes.map(h => ({
rot: h.rot
}));
const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
const url = URL.createObjectURL(blob);
const a = document.createElement("a");
a.href = url;
a.download = "rotations_hex.json";
a.click();
URL.revokeObjectURL(url);
};

/* applicazione progressiva */
function applyNextRotation(){
if(!loadedRotations) return;
if(loadStepIndex >= hexes.length) return;
hexes[loadStepIndex].rot = loadedRotations[loadStepIndex].rot;
hexes[loadStepIndex].target = loadedRotations[loadStepIndex].rot;
loadStepIndex++;
requestAnimationFrame(applyNextRotation);
}

/* file picker */
loadRotBtn.onclick = () => {
rotInput.value = "";
rotInput.click();
};

/* file letto */
rotInput.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        try{
        loadedRotations = JSON.parse(ev.target.result);
        loadStepIndex = 0;
        applyNextRotation();
        }catch(err){
            alert("Invalid file");
        }
    };
    reader.readAsText(file);
};

/* ---------- SAVE MASTER PNG ---------- */
saveBtn.onclick=()=>{
const hexSize = MASTER_S;
const size=Math.ceil(hexSize*2);
const off=document.createElement("canvas");
off.width=size;
off.height=size;
const o=off.getContext("2d");
o.translate(size/2,size/2);
const p=hexPts(0,0,hexSize);
o.beginPath();
o.moveTo(p[0].x,p[0].y);
for(let i=1;i<6;i++){
o.lineTo(p[i].x,p[i].y);
}
o.closePath();
o.clip();
o.fillStyle="#d60000";
o.beginPath();
o.moveTo(p[0].x,p[0].y);
for(let i=1;i<6;i++){
o.lineTo(p[i].x,p[i].y);
}
o.closePath();
o.fill();
o.strokeStyle="white";
o.lineWidth=6 * (hexSize / 45);
o.lineCap="round";
o.lineJoin="round";
for(const s of strokes){
if(s.length<2) continue;
o.beginPath();
for(let i=0;i<s.length;i++){
const x=s[i].x*hexSize;
const y=s[i].y*hexSize;
if(i===0) o.moveTo(x,y);
else o.lineTo(x,y);
}
o.stroke();
}
const url=off.toDataURL("image/png");
const a=document.createElement("a");
a.href=url;
a.download="master_pattern.png";
a.click();
texture=new Image();
texture.onload=()=>{};
texture.src=url;
};

/* ---------- LOAD IMAGE (FOR TEXTURE) ---------- */
fileInput.onchange=e=>{
const file=e.target.files[0];
if(!file) return;
const reader=new FileReader();
reader.onload=ev=>{
texture=new Image();
texture.onload=()=>{};
texture.src=ev.target.result;
};
reader.readAsDataURL(file);
};

loadBtn.onclick = () => {
if(confirm("Clear current image and load a new one?")){
    texture = null;
    fileInput.click();
}
};

savePavementBtn.onclick = () => {
    const off = document.createElement("canvas");
    const octx = off.getContext("2d");
    off.width = W;
    off.height = H;
    octx.drawImage(c, 0, 0);
    const url = off.toDataURL("image/png");
    const a = document.createElement("a");
    a.href = url;
    a.download = "pavement.png";
    a.click();
};


/* ---------- LOOP ---------- */
function loop(){
ctx.clearRect(0,0,W,H);

for(const h of hexes){
    let diff = h.target - h.rot;
    if(diff > Math.PI) diff -= Math.PI * 2;
    if(diff < -Math.PI) diff += Math.PI * 2;
    h.rot += diff * 0.15;
    drawHex(h, S);
}

drawMasterHex();

requestAnimationFrame(loop);
}

/* ---------- START ---------- */
resize();
loop();
addEventListener("resize",resize);
</script>

</body>
</html>
